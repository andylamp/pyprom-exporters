[project]
name = "pyprom-exporters"
version = "0.3.0"
description = "Prometheus exporters for IoT and smart-home devices, including TP-Link Tapo plugs."
readme = "README.md"
authors = [{ name = "Andreas A. Grammenos", email = "ag926@cl.cam.ac.uk" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "prometheus-client>=0.26.0",
    "omegaconf>=2.3.1",
    "python-kasa>=0.11.0.1",
]

[project.optional-dependencies]
docs = [
    "sphinx>=9.0.4; python_version < '3.12'",
    "sphinx>=9.1.0; python_version >= '3.12'",
    "myst-parser>=5.1.0",
    "furo>=2025.12.19",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "slipcover>=1.1.0; python_version < '3.15'",
    "genbadge[coverage]>=1.1.3",
    "prek>=0.5.3",
    "ty>=0.0.84",
    "bandit>=1.9.4",
    "sphinx>=9.0.4; python_version < '3.12'",
    "sphinx>=9.1.0; python_version >= '3.12'",
    "myst-parser>=5.1.0",
    "furo>=2025.12.19",
]

[project.scripts]
prom-exporter = "pyprom_exporters.prom_exporter:main"
docs = "pyprom_exporters.docs_cli:main"
benchmark = "pyprom_exporters.benchmarks.scalability:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.ruff]
# Extend Ruff's standard exclusions instead of duplicating its evolving defaults.
extend-exclude = [".ipynb_checkpoints", ".ty", ".pyenv", ".pytest_cache", ".vscode", "build", "site-packages"]

# Same as Black.
line-length = 119
indent-width = 4

# Match the minimum supported Python version.
target-version = "py311"

[tool.ruff.lint]
# Enable every stable and preview Ruff lint rule.
select = ["ALL"]
preview = true
# Trailing commas are owned by the formatter; enabling both creates conflicting edits.
ignore = ["missing-trailing-comma"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Pytest uses assertions, concrete expected values, and internal-state regression checks.
"tests/**/*.py" = ["assert", "magic-value-comparison", "private-member-access"]
# Sphinx loads conf.py as a standalone configuration module.
"docs/conf.py" = ["implicit-namespace-package"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Format code examples in docstrings as well as source files.
docstring-code-format = true

docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bound worker startup overhead on machines with many cores. Override with -n N or -n 0.
addopts = ["-n", "auto", "--maxprocesses=4", "--dist=worksteal"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "tests", "benchmarks", "docs/conf.py"]
