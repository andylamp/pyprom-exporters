name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Prek checks
        run: uv run --locked prek run --all-files
      - name: Build documentation
        run: uv run --locked docs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --locked
      - name: Parallel pytest with SlipCover coverage
        run: uv run --locked python -m slipcover --source src/pyprom_exporters --xml --out coverage.xml -m pytest
      - name: Generate coverage badge
        run: uv run --locked genbadge coverage -i coverage.xml -o coverage.svg -l
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.svg

  update-coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-3.14
          path: coverage-artifact
      - name: Update badge for the tested revision
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Main has advanced; skipping the outdated coverage badge."
            exit 0
          fi
          cp coverage-artifact/coverage.svg coverage.svg
          git add coverage.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[skip ci] Update coverage badge'
          git push origin HEAD:main

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.14"
      - name: Verify lockfile
        run: uv lock --check
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/pyprom-wheel-test
          uv pip install --python /tmp/pyprom-wheel-test/bin/python dist/*.whl
          /tmp/pyprom-wheel-test/bin/prom-exporter --help
      - name: Build container
        run: docker build -t pyprom-exporters:test .
      - name: Smoke test container entrypoint
        run: docker run --rm pyprom-exporters:test --help
