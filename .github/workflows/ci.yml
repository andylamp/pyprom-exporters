name: Code quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, formatting, types and documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked
      - name: Prek checks
        run: uv run --locked prek run --all-files
      - name: Build documentation
        run: uv run --locked docs

  test:
    name: Tests and coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --locked
      - name: Parallel pytest with SlipCover coverage
        run: uv run --locked python -m slipcover --source src/pyprom_exporters --xml --out coverage.xml -m pytest
      - name: Generate coverage badge
        run: uv run --locked genbadge coverage -i coverage.xml -o coverage.svg -l
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.svg

  update-coverage-badge:
    name: Publish coverage badge
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    concurrency:
      group: coverage-badge-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Only artifacts from this successful main CI run are published, never PR artifacts.
      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-3.14
          path: ${{ runner.temp }}/coverage-artifact
      - name: Publish the badge for the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # The dedicated branch is initialized separately; this job updates one fixed file.
          gh api "repos/$GH_REPO/contents/coverage.svg?ref=coverage-badges" \
            > "$RUNNER_TEMP/current-coverage-badge.json"
          jq -e '.type == "file" and .encoding == "base64" and (.sha | type == "string")' \
            "$RUNNER_TEMP/current-coverage-badge.json" > /dev/null
          jq --rawfile badge "$RUNNER_TEMP/coverage-artifact/coverage.svg" \
            --arg message "Update coverage badge for $GITHUB_SHA (run $GITHUB_RUN_ID)" '
            if (.content | gsub("\n"; "")) == ($badge | @base64) then empty
            else {
              branch: "coverage-badges",
              message: $message,
              sha: .sha,
              content: ($badge | @base64)
            } end
          ' "$RUNNER_TEMP/current-coverage-badge.json" > "$RUNNER_TEMP/coverage-badge-update.json"
          if [[ ! -s "$RUNNER_TEMP/coverage-badge-update.json" ]]; then
            echo "Coverage badge is unchanged; nothing to publish."
            exit 0
          fi
          if [[ $(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha') != "$GITHUB_SHA" ]]; then
            echo "Main has advanced; skipping the outdated coverage badge."
            exit 0
          fi
          # The expected file SHA rejects concurrent writes; main is never changed or bypassed.
          gh api --method PUT "repos/$GH_REPO/contents/coverage.svg" \
            --input "$RUNNER_TEMP/coverage-badge-update.json" --silent

  build:
    name: Build and smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.19"
          python-version: "3.14"
      - name: Verify lockfile
        run: uv lock --check
      - name: Build distributions
        run: uv build --no-sources
      - name: Smoke test installed wheel
        run: |
          uv venv /tmp/pyprom-wheel-test
          uv pip install --python /tmp/pyprom-wheel-test/bin/python dist/*.whl
          /tmp/pyprom-wheel-test/bin/prom-exporter --help
      - name: Build container
        run: docker build -t pyprom-exporters:test .
      - name: Smoke test container entrypoint
        run: docker run --rm pyprom-exporters:test --help
